[package]
name = "hylic-benchmark"
version = "0.1.0"
edition = "2024"
description = "Benchmark suite and comparison executors for hylic"

[dependencies]
hylic = { path = "../hylic" }
hylic-parallel-lifts = { path = "../hylic-parallel-lifts" }
rayon = "1.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"

[[bench]]
name = "bench_overhead"
harness = false

[[bench]]
name = "bench_matrix"
harness = false

[[bench]]
name = "bench_modsim"
harness = false
