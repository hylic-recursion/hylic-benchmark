[package]
name = "hylic-benchmark"
version = "0.8.0"
edition = "2024"
description = "Benchmark suite and comparison executors for hylic."
license = "MIT"
readme = "README.md"
publish = false

[dependencies]
hylic = "0.8"
rayon = "1.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"

[[bench]]
name = "bench_overhead"
harness = false

[[bench]]
name = "bench_matrix"
harness = false

[[bench]]
name = "bench_modsim"
harness = false

[[bench]]
name = "bench_quick"
harness = false
